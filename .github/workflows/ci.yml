name: Pure Python smoke (no Isaac, no robot)
on:
  push:
  pull_request:
jobs:
  cpu_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run pure-Python tests
        run: python -m unittest discover -s tests -v
